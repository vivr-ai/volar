name: Proxy CI

# Issue 1.6: mirrors dashboard-ci.yml (issue 1.5), scoped to apps/proxy.
# The job name ("ci") is what gets set as a required status check in the
# repo's branch protection rules (a one-time GitHub.com setting, not
# expressible in this file) — see Epic 1's Conventions.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/proxy/**"
      - "packages/shared/**"
      - ".github/workflows/proxy-ci.yml"

concurrency:
  group: proxy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Issue 5.5: routed through `turbo run ... --filter` rather than a
      # bare `pnpm --filter @volar/proxy <script>`. apps/proxy started
      # depending on @volar/shared's compiled output in issue 5.2
      # ("main": "dist/index.js"), and a bare pnpm --filter call skips
      # Turborepo's dependency graph entirely -- dist/ never gets built,
      # so proxy's own test/typecheck/lint steps would fail with
      # "Cannot find package '@volar/shared'". `turbo run <task>
      # --filter=@volar/proxy` honors turbo.json's `dependsOn: ["^build"]`
      # and builds @volar/shared first automatically. See docs/CI.md.
      - name: Lint
        run: pnpm exec turbo run lint --filter=@volar/proxy

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@volar/proxy

      - name: Test
        run: pnpm exec turbo run test --filter=@volar/proxy
