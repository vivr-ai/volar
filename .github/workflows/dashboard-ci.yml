name: Dashboard CI

# Issue 1.5: runs lint, typecheck, and unit tests for apps/dashboard on
# every PR touching that app or the shared package it depends on. This
# workflow's job name ("ci") is what gets set as a required status check
# in the repo's branch protection rules (a one-time GitHub.com setting,
# not something expressible in this file) — see Epic 1's Conventions.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/shared/**"
      - ".github/workflows/dashboard-ci.yml"

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Issue 5.5: routed through `turbo run ... --filter` rather than a
      # bare `pnpm --filter @volar/dashboard <script>`, so that if/when
      # apps/dashboard starts consuming @volar/shared's compiled output
      # (the same way apps/proxy did in issue 5.2), Turborepo's
      # `dependsOn: ["^build"]` builds it first automatically instead of
      # this workflow silently skipping that step. See docs/CI.md.
      - name: Lint
        run: pnpm exec turbo run lint --filter=@volar/dashboard

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@volar/dashboard

      - name: Test
        run: pnpm exec turbo run test --filter=@volar/dashboard
