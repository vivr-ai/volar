name: Secret Scan

# Issue 1.9: blocks any PR that introduces a committed secret. Runs the
# Gitleaks CLI directly (MIT-licensed) rather than the gitleaks-action
# marketplace wrapper, which requires a paid per-seat license for
# private-repo use beyond a single repo per organization (see
# docs/SECRETS.md for the full rationale). Repo-wide, no path filter —
# a leaked secret can appear in any file, not just app code.
on:
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for committed secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
